name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - develop

jobs:

  test-accounts:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Run flake8
        run: poetry run flake8 src

      - name: Run mypy
        run: poetry run mypy src --explicit-package-bases

      #- name: Run accounts tests with coverage
      #  run: poetry run pytest src/tests/test_integration/test_accounts.py --cov=src --cov-report=term-missing


  test-movies:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Run flake8
        run: poetry run flake8 src

      - name: Run mypy
        run: poetry run mypy src --explicit-package-bases

      #- name: Run movies tests with coverage
      #  run: poetry run pytest src/tests/test_integration/test_movies.py --cov=src --cov-report=term-missing


  test-profiles:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Run flake8
        run: poetry run flake8 src

      - name: Run mypy
        run: poetry run mypy src --explicit-package-bases

      #- name: Run profiles tests with coverage
      #  run: poetry run pytest src/tests/test_integration/test_profiles.py --cov=src --cov-report=term-missing


  test-e2e:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      #- name: Start Docker Compose and wait for completion
      #  run: |
      #    docker compose -f docker-compose-tests.yml up --build --abort-on-container-exit --exit-code-from web

      #- name: Cleanup
      #  if: always()
      #  run: |
      #    docker compose -f docker-compose-tests.yml down


  deploy:

    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up SSH Agent
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 Host to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Execute Deployment Script on EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} 'cd /home/ubuntu/cinema-project && git pull && bash commands/deploy.sh'