[tool.poetry]
name = "cinema"
version = "0.1.0"
description = ""
authors = ["iryna <irakirvas78@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.136.1"
uvicorn = "^0.46.0"
sqlalchemy = "^2.0.49"
pydantic-settings = "^2.14.0"
alembic = "^1.18.4"
asyncpg = "^0.31.0"
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
emails = "^1.1.1"
python-multipart = "^0.0.27"
email-validator = "^2.3.0"
bcrypt = "4.0.1"
pyjwt = "^2.12.1"
celery = "^5.6.3"
redis = "^7.4.0"
fastapi-mail = "^1.6.4"
minio = "^7.2.20"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "flake8>=7.3.0",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0"
]
[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = false
ignore_errors = true